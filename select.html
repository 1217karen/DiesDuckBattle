<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>CHARACTER SELECT | DiesDuckBattle</title>
  <link href="https://fonts.googleapis.com/css2?family=Iceberg&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/select.css">
  <link rel="stylesheet" href="css/common-menu.css">
  <link rel="stylesheet" href="css/page-loading.css">
</head>
<body class="has-common-menu page-select page-loading">
  <script src="js/pageLoadGate.js"></script>
  <noscript><p class="page-load-noscript">このページを表示するにはJavaScriptを有効にしてください。</p></noscript>
<header id="common-menu" class="common-menu"><details><summary><span class="common-menu__icon" aria-hidden="true">☰</span><span data-identity role="status"></span><span class="common-menu__label">メニュー</span></summary><nav aria-label="共通メニュー"></nav><p data-feedback role="status" hidden></p></details></header>
  <script src="js/menuDisplayCache.js"></script>
<div id="bg" aria-hidden="true"></div>
<main data-page-content class="screen">
  <h1 class="selectTitle">CHARACTER<br>SELECT</h1>
  <section class="selectGrid" aria-label="キャラクター選択">
    <div class="cell cell--p1Top"><div class="silhouette" id="p1-battler-slot" aria-label="1P 自分 固定"><img class="figure silhouette__img" alt=""></div></div>
    <div class="cell cell--midTop"><div class="midStack">
      <button class="duckPick" id="p1-duck-slot" type="button" aria-label="1P アヒルを選択" aria-haspopup="dialog" aria-controls="tray"><img class="duckPlaceholder duckPick__img" alt=""></button>
      <button id="vsButton" class="vs vs--disabled" type="button" disabled aria-label="戦闘開始：自分のDuckと相手を選択してください"><span class="vs__inner"><span class="vs__text">VS</span></span></button>
      <div class="duckPick opponent" id="p2-duck-slot" aria-label="2P 公開Duck"><img class="duckPlaceholder duckPick__img" alt=""></div>
    </div></div>
    <div class="cell cell--p2Top"><button type="button" id="p2-battler-slot" class="silhouette" aria-label="2P 相手を選択" aria-haspopup="dialog" aria-controls="tray"><img class="figure silhouette__img" alt=""></button></div>
    <div class="cell cell--p1Info"><section class="infoPanel" aria-label="1P情報"><h2>1P — <span id="self-name">自分</span></h2><p id="load-status" role="status"></p><p class="infoPanel__name" id="p1-battler-name"></p><p class="infoPanel__body" id="p1-battler-info"></p><div class="infoPanel__body--sub"><p class="infoPanel__name" id="p1-duck-name"></p><p class="infoPanel__body" id="p1-duck-info" aria-live="polite"></p></div></section></div>
    <div class="cell cell--midInfo"><button class="midAction" id="random-opponent" type="button" disabled>対戦相手ランダム</button><p id="random-win-streak" role="status" aria-live="polite" hidden></p><p id="vs-reason">自分のDuckと相手を選択してください。</p><p id="battle-result" role="status" aria-live="polite"></p></div>
    <div class="cell cell--p2Info"><section class="infoPanel" aria-label="2P情報"><h2>2P — <span id="opponent-name">相手を選択</span></h2><p class="infoPanel__name" id="p2-battler-name"></p><p class="infoPanel__body" id="p2-battler-info"></p><div class="infoPanel__body--sub"><p class="infoPanel__name" id="p2-duck-name"></p><p class="infoPanel__body" id="p2-duck-info"></p></div></section></div>
  </section>
</main>
<dialog data-page-content id="tray" class="tray" aria-labelledby="trayTitle"><div class="tray__header"><h2 id="trayTitle">1P：アヒルを選択</h2><button id="trayClose" type="button" autofocus>閉じる</button></div><div id="trayGrid" class="tray__grid"></div></dialog>
<script src="js/pageEntry.js" data-page-src="js/select.js"></script>
<script type="module" src="js/commonMenu.js"></script>
</body>
</html>
