<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>運営ログイン | DIES DUCK BATTLE</title>
  <script src="js/siteTheme.js"></script>
  <link rel="stylesheet" href="css/common-theme.css">
  <link rel="stylesheet" href="css/common-page.css">
  <link rel="stylesheet" href="css/operator-login.css">
</head>
<body>
  <main class="page-shell operator-login">
    <header class="page-header"><p class="page-eyebrow">DIES DUCK BATTLE</p><h1 class="page-title">運営ログイン</h1></header>
    <p>事前に登録された運営アカウントでログインしてください。このブラウザーのログイン状態が切り替わります。</p>
    <form id="operator-form">
      <fieldset id="operator-fields" disabled>
        <label for="operator-email">メールアドレス</label><input id="operator-email" type="email" autocomplete="username" required>
        <label for="operator-password">パスワード</label><input id="operator-password" type="password" autocomplete="current-password" required>
        <button type="submit" class="primary">運営としてログイン</button>
      </fieldset>
    </form>
    <button id="operator-logout" type="button" disabled>このブラウザーからログアウト</button>
    <p id="operator-message" role="status">読み込み中…</p>
    <noscript>JavaScriptを有効にしてください。</noscript>
  </main>
  <script type="module" src="js/operatorLoginPage.js"></script>
</body>
</html>
