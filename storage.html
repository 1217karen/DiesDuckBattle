<!doctype html>
<html lang="ja">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>バトル履歴 | DiesDuckBattle</title>
  <link rel="stylesheet" href="css/storage.css">
  <link rel="stylesheet" href="css/common-menu.css">
  <link rel="stylesheet" href="css/page-loading.css">
</head>
<body class="has-common-menu page-loading">
  <script src="js/pageLoadGate.js"></script>
  <noscript><p class="page-load-noscript">このページを表示するにはJavaScriptを有効にしてください。</p></noscript>
<header id="common-menu" class="common-menu"><details><summary><span class="common-menu__icon" aria-hidden="true">☰</span><span data-identity role="status"></span><span class="common-menu__label">メニュー</span></summary><nav aria-label="共通メニュー"></nav><p data-feedback role="status" hidden></p></details></header>
  <script src="js/menuDisplayCache.js"></script>

  <main data-page-content class="wrap">
    <header class="head">
      <h1 class="title">💥バトル履歴💥</h1>
      <p class="hint">保存済みの戦闘結果を30件ずつ表示します。</p>
      <div class="tools">
        <label for="eno">指定ENo <input id="eno" type="text" inputmode="numeric" pattern="[0-9]*" size="8"></label>
        <label for="outcome">指定ENoの勝敗 <select id="outcome" disabled>
          <option value="all">すべて</option><option value="win">勝ち</option><option value="lose">負け</option><option value="draw">引き分け</option>
        </select></label>
        <label for="favorites">お気に入り <select id="favorites" disabled>
          <option value="all">すべて</option><option value="only">★のみ</option>
        </select></label>
        <label for="order">表示順</label>
        <select id="order" class="orderSelect">
          <option value="desc">新しい順</option>
          <option value="asc">古い順</option>
        </select>
      </div>
    </header>

    <p id="accountNotice" class="hint" hidden></p>
    <p id="favoriteError" class="empty error" role="alert" hidden>お気に入りを更新できませんでした。再度お試しください。</p>
    <div id="list" class="list" aria-live="polite"></div>
    <div id="empty" class="empty" hidden>履歴がありません。</div>
    <div id="error" class="empty error" hidden>履歴を読み込めませんでした。</div>

    <nav class="pager" aria-label="履歴ページ">
      <button id="prev" class="btn" type="button">≪ 前の30件</button>
      <span id="pageInfo" class="pageInfo">1 / 1</span>
      <button id="next" class="btn" type="button">次の30件 ≫</button>
    </nav>
  </main>

  <script src="js/pageEntry.js" data-page-src="js/storagePage.js"></script>
<script type="module" src="js/commonMenu.js"></script>
</body>
</html>
