<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お知らせ・報告 | DiesDuckBattle</title>
  <script src="js/siteTheme.js"></script>
  <script type="module" src="js/siteThemeAuth.js"></script>
  <link rel="stylesheet" href="css/common-theme.css">
  <link rel="stylesheet" href="css/common-page.css">
  <link rel="stylesheet" href="css/notice.css">
  <link rel="stylesheet" href="css/common-menu.css">
  <link rel="stylesheet" href="css/page-loading.css">
</head>
<body class="has-common-menu page-loading">
  <script src="js/pageLoadGate.js"></script>
  <noscript><p class="page-load-noscript">このページを表示するにはJavaScriptを有効にしてください。</p></noscript>
  <header id="common-menu" class="common-menu"><details class="common-menu__nav"><summary aria-label="ゲームメニューを開く"><span class="common-menu__icon" aria-hidden="true">☰</span></summary><nav aria-label="ゲームメニュー"></nav></details><details class="common-menu__account"><summary aria-label="アカウントメニューを開く" aria-disabled="true" tabindex="-1"><span data-identity role="status"></span><span data-account-arrow aria-hidden="true" hidden>▾</span></summary><div class="common-menu__account-dropdown"><div data-account-menu></div><p data-feedback role="status" hidden></p></div></details></header>
  <script src="js/menuDisplayCache.js"></script>
  <main data-page-content class="notice-shell page-shell">
    <header class="notice-heading page-header">
      <p class="page-eyebrow">DIES DUCK BATTLE</p>
      <h1 class="page-title">お知らせ・報告</h1>
      <p class="notice-lead">運営からのお知らせと、みなさんの報告・要望。</p>
      <p class="notice-demo">お知らせの記事はサンプルです。報告・要望は公開掲示板です。</p>
    </header>
    <div class="notice-tabs" role="tablist" aria-label="お知らせ・報告">
      <button id="tab-notices" type="button" role="tab" aria-selected="true" aria-controls="panel-notices">お知らせ</button>
      <button id="tab-reports" type="button" role="tab" aria-selected="false" aria-controls="panel-reports" tabindex="-1">報告・要望</button>
    </div>
    <section id="panel-notices" role="tabpanel" aria-labelledby="tab-notices" tabindex="0">
      <div class="notice-layout">
        <aside class="notice-sidebar page-panel" aria-labelledby="notice-index-heading">
          <h2 id="notice-index-heading" class="notice-side-title">NOTICE LIST</h2>
          <p class="notice-side-help">タイトルを選ぶと記事へ移動します。</p>
          <nav id="notice-index" class="notice-index" aria-label="お知らせ一覧"></nav>
        </aside>
        <div id="notice-articles" class="notice-main"></div>
      </div>
    </section>
    <section id="panel-reports" role="tabpanel" aria-labelledby="tab-reports" tabindex="0" hidden>
      <div class="notice-layout">
        <aside class="notice-sidebar page-panel" aria-label="投稿・一覧の絞り込み">
          <button id="feedback-new" class="notice-new-post" type="button" disabled aria-controls="feedback-form" aria-expanded="false">＋ 新規投稿</button>
          <p id="feedback-auth" class="notice-side-help">ログイン状態を確認中です。</p>
          <div class="notice-filters">
            <fieldset><legend>種別</legend>
              <label><input type="radio" name="report-type" value="all" checked>すべて</label>
              <label><input type="radio" name="report-type" value="bug">不具合</label>
              <label><input type="radio" name="report-type" value="request">要望</label>
              <label><input type="radio" name="report-type" value="question">質問・相談</label>
            </fieldset>
            <fieldset><legend>状態</legend>
              <label><input type="radio" name="report-status" value="all" checked>すべて</label>
              <label><input type="radio" name="report-status" value="open">受付中</label>
              <label><input type="radio" name="report-status" value="confirmed">確認済</label>
              <label><input type="radio" name="report-status" value="resolved">対応済</label>
              <label><input type="radio" name="report-status" value="withdrawn">取り下げ</label>
            </fieldset>
            <div class="notice-sort"><label for="report-sort">並び順</label><select id="report-sort"><option value="newest">新しい順</option><option value="reactions">同意が多い順</option></select></div>
          </div>
        </aside>
        <div class="notice-main">
          <form id="feedback-form" class="feedback-form page-panel" hidden>
            <h2>新規投稿</h2>
            <p class="notice-side-help">投稿・返信は公開されます。個人情報は書かないでください。投稿後の編集・削除はできません。補足は返信で追加できます。</p>
            <fieldset>
              <label for="feedback-category">種別</label>
              <select id="feedback-category"><option value="bug">不具合</option><option value="request">要望</option><option value="question">質問・相談</option></select>
              <label for="feedback-title">タイトル</label><input id="feedback-title" required aria-describedby="feedback-title-count">
              <p id="feedback-title-count" class="feedback-count"></p>
              <label for="feedback-body">本文</label><textarea id="feedback-body" rows="6" required aria-describedby="feedback-body-count"></textarea>
              <p id="feedback-body-count" class="feedback-count"></p>
              <div class="feedback-actions"><button type="submit" class="primary" data-feedback-write="account">投稿する</button><button id="feedback-cancel" type="button">閉じる</button></div>
            </fieldset>
            <p id="feedback-form-message" role="status"></p>
          </form>
          <div class="feedback-toolbar"><p id="feedback-message" role="status"></p><button id="feedback-reload" type="button">再読み込み</button></div>
          <div id="feedback-list" class="feedback-list" aria-label="報告・要望一覧"></div>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="js/commonMenu.js"></script>
  <script src="js/pageEntry.js" data-page-src="js/noticePage.js"></script>
</body>
</html>
