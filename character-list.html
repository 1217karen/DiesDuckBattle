<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>キャラリスト | DiesDuckBattle</title>
  <script src="js/siteTheme.js"></script>
  <script type="module" src="js/siteThemeAuth.js"></script>
  <link rel="stylesheet" href="css/common-theme.css">
  <link rel="stylesheet" href="css/character-list.css">
  <link rel="stylesheet" href="css/common-menu.css">
  <link rel="stylesheet" href="css/page-loading.css">
</head>
<body class="has-common-menu page-loading">
  <script src="js/pageLoadGate.js"></script>
  <noscript><p class="page-load-noscript">このページを表示するにはJavaScriptを有効にしてください。</p></noscript>
<header id="common-menu" class="common-menu"><details class="common-menu__nav"><summary aria-label="ゲームメニューを開く"><span class="common-menu__icon" aria-hidden="true">☰</span></summary><nav aria-label="ゲームメニュー"></nav></details><details class="common-menu__account"><summary aria-label="アカウントメニューを開く" aria-disabled="true" tabindex="-1"><span data-identity role="status"></span><span data-account-arrow aria-hidden="true" hidden>▾</span></summary><div class="common-menu__account-dropdown"><div data-account-menu></div><p data-feedback role="status" hidden></p></div></details></header>
  <script src="js/menuDisplayCache.js"></script>
  <main data-page-content class="character-list-shell">
    <header><p class="eyebrow">DIES DUCK BATTLE</p><h1>キャラリスト</h1></header>
    <div class="character-list-filters">
      <label>名前<input id="name-filter" type="search" placeholder="バトラー名・アヒル名を検索"></label>
      <label>属性<input id="attribute-filter" type="search" placeholder="属性を検索"></label>
      <label>タイプ<select id="type-filter"><option value="">すべて</option>
        <option value="attack">アタック</option><option value="defense">ディフェンス</option><option value="speed">スピード</option>
        <option value="heal">ヒール</option><option value="technical">テクニカル</option><option value="normal">ノーマル</option></select></label>
      <label>並び順<select id="sort"><option value="eno-asc">ENo.昇順</option><option value="eno-desc">ENo.降順</option><option value="best">最大連勝数が多い順</option></select></label>
    </div>
    <p id="list-message" role="status" aria-live="polite"></p>
    <div id="character-list" class="character-list-grid"></div>
  </main>
  <script src="js/pageEntry.js" data-page-src="js/characterListPage.js"></script>
  <script type="module" src="js/commonMenu.js"></script>
</body>
</html>
