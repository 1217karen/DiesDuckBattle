<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>戦闘設定 | DiesDuckBattle</title>
  <link rel="stylesheet" href="css/common-theme.css">
  <link rel="stylesheet" href="css/setting.css">
  <link rel="stylesheet" href="css/common-menu.css">
  <link rel="stylesheet" href="css/online-editor.css">
  <link rel="stylesheet" href="css/page-loading.css">
</head>
<body class="has-common-menu page-loading">
  <script src="js/pageLoadGate.js"></script>
  <noscript><p class="page-load-noscript">このページを表示するにはJavaScriptを有効にしてください。</p></noscript>
<header id="common-menu" class="common-menu"><details><summary><span class="common-menu__icon" aria-hidden="true">☰</span><span data-identity role="status"></span><span class="common-menu__label">メニュー</span></summary><nav aria-label="共通メニュー"></nav><p data-feedback role="status" hidden></p></details></header>
  <script src="js/menuDisplayCache.js"></script>
  <main data-page-content class="setting-shell">
    <header class="page-header">
      <p class="eyebrow">DIES DUCK BATTLE</p>
      <h1>BATTLE SETTING</h1>
      <p>戦うスタイルを、あなただけの組合せに。</p>
      <p class="muted">Battlerの共通スキルと、アヒルごとの能力・スキルを設定します。作成途中でも保存できます。</p>
      <a class="page-link" href="character.html">表示設定へ →</a>
    </header>
    <p id="load-message" role="status"></p>
    <section id="online-edit-status" class="online-edit-status" aria-label="オンライン保存状態"></section>
    <p class="muted">この画面はオンライン設定を編集します。保存後、キャラクター選択で再読み込みして対戦に使用できます。</p>
    <noscript>設定ページを使用するにはJavaScriptを有効にしてください。</noscript>
    <div id="editor" hidden>
      <section aria-labelledby="battler-heading">
        <div class="section-heading"><span>01</span><div><h2 id="battler-heading">BATTLER SETTING</h2><p>すべてのアヒルで共有するB・Dスキル</p></div></div>
        <div id="battler-editor" class="battler-grid"></div>
      </section>
      <section aria-labelledby="duck-heading">
        <div class="section-heading"><span>02</span><div><h2 id="duck-heading">DUCK SETTING</h2><p>アヒルごとの能力・ダイス・A・Cスキル</p></div></div>
        <p id="public-settings-message" class="public-settings-error" role="status" hidden></p>
        <div class="duck-toolbar"><div id="duck-tabs" aria-label="編集するアヒル"></div><button id="add-duck" type="button">＋ 新規アヒル</button></div>
        <div id="duck-editor"></div>
      </section>
      <footer class="save-bar"><div><strong id="save-message" role="status">変更はありません</strong><p class="muted">表示中のENoへ設定全体を保存します。ローカル仮データは変更しません。</p></div><button id="save" class="primary" type="button">設定を保存</button></footer>
    </div>
  </main>
  <script src="js/pageEntry.js" data-page-src="js/settingPage.js"></script>
<script type="module" src="js/commonMenu.js"></script>
</body>
</html>
