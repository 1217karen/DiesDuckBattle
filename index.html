<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>DIES DUCK BATTLE</title>
  <link rel="stylesheet" href="css/common-fonts.css">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/common-menu.css">
  <link rel="stylesheet" href="css/page-loading.css">
</head>
<body class="home-page has-common-menu page-loading">
  <script src="js/pageLoadGate.js"></script>
  <noscript><p class="page-load-noscript">このページを表示するにはJavaScriptを有効にしてください。</p></noscript>
  <header id="common-menu" class="common-menu"><details class="common-menu__nav"><summary aria-label="ゲームメニューを開く"><span class="common-menu__icon" aria-hidden="true">☰</span></summary><nav aria-label="ゲームメニュー"></nav></details><details class="common-menu__account"><summary aria-label="アカウントメニューを開く" aria-disabled="true" tabindex="-1"><span data-identity role="status"></span><span data-account-arrow aria-hidden="true" hidden>▾</span></summary><div class="common-menu__account-dropdown"><div data-account-menu></div><p data-feedback role="status" hidden></p></div></details></header>
  <script src="js/menuDisplayCache.js"></script>
  <main data-page-content class="home">
    <header class="home__header">
      <h1>DIES DUCK BATTLE</h1>
      <p class="home__notice">開発版 — 現在開発中です。</p>
      <p id="home-status" role="status" tabindex="-1"></p>
    </header>
    <div id="home-guest" class="home__menu home__guest" hidden>
      <img class="home__logo" src="img/Dice_logo.png" alt="DIES DUCK BATTLE" width="520" height="320">
      <button class="home__link" type="button" data-auth-mode="login">ログイン / 新規登録</button>
      <p class="home__notice">開発版 — 現在開発中です。</p>
    </div>
    <section id="home-game" class="home__dashboard" aria-label="マイホーム" hidden>
      <div class="home__standing"><img id="home-standing" alt="自分のバトラーの立ち絵" width="500" height="800"></div>
      <div class="home__dashboard-ui">
        <section class="home__voice home__voice--own" aria-labelledby="home-own-title">
          <h2 id="home-own-title">自分のひとこと</h2>
          <div class="home__voice-row">
            <img id="home-icon" class="home__avatar" alt="" width="60" height="60">
            <div class="home__voice-body"><p id="home-identity" class="home__identity"></p><p id="home-message"></p></div>
            <button id="home-message-edit" class="home__edit" type="button" disabled aria-label="ひとことを編集">✎</button>
          </div>
          <form id="home-message-form" class="home__message-form" hidden>
            <label for="home-message-input">ひとこと（60文字まで）</label>
            <textarea id="home-message-input" rows="3" aria-describedby="home-message-count home-message-status"></textarea>
            <p id="home-message-count"></p>
            <div><button id="home-message-cancel" type="button">キャンセル</button><button id="home-message-save" type="submit">保存</button></div>
          </form>
          <p id="home-message-status" role="status"></p>
        </section>
        <section class="home__voice" aria-labelledby="home-voices-title">
          <h2 id="home-voices-title">みんなのひとこと</h2>
          <ul id="home-messages" class="home__voices"></ul>
          <p id="home-messages-status" role="status"></p>
        </section>
        <nav class="home__menu home__game-menu" aria-label="ゲームメニュー">
          <a class="home__link" href="select.html">アヒルバトル</a>
          <a class="home__link" href="setting.html">戦闘設定</a>
          <a class="home__link" href="storage.html">バトル履歴</a>
          <a class="home__link" href="character.html">キャラ設定</a>
          <a class="home__link" href="rulebook.html">ルールブック</a>
          <a class="home__link" href="character-list.html">キャラリスト</a>
          <a class="home__link" href="notice.html">お知らせ</a>
          <button id="home-logout" class="home__link" type="button">ログアウト</button>
        </nav>
      </div>
    </section>
    <nav class="home__legal" aria-label="サイトの規約">
      <a href="rulebook.html#guidelines">サイトガイドライン</a>
      <a href="legal.html#terms">利用規約</a>
      <a href="legal.html#privacy">プライバシーポリシー</a>
    </nav>
    <p id="home-feedback" role="status"></p>
    <noscript>認証とメニューの表示にはJavaScriptを有効にしてください。</noscript>
  </main>
  <dialog data-page-content id="auth-dialog" class="auth-dialog" aria-labelledby="auth-dialog-title">
    <div class="auth-dialog__head"><h2 id="auth-dialog-title">新規登録・ログイン</h2><button id="auth-close" type="button">閉じる</button></div>
    <div id="auth-root" class="auth auth--embedded"></div>
  </dialog>
  <script type="module" src="js/commonMenu.js"></script>
  <script src="js/pageEntry.js" data-page-src="js/indexPage.js"></script>
</body>
</html>
