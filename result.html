<!doctype html>
<html lang="ja">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battle Result | DiesDuckBattle</title>
  <link rel="stylesheet" href="css/result.css">
  <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab&display=swap" rel="stylesheet">
</head>
<body>
  <div class="whiteStripe" aria-hidden="true"></div>
  <header class="header">
    <div class="headerInner">
      <div class="side left">
        <div class="battlerIcon placeholderIcon" id="p1BattlerIcon" aria-hidden="true">1P</div>
        <div class="nameBlock"><div class="nameLine" id="p1Name">-</div></div>
        <div class="duckIcon underName placeholderIcon" id="p1DuckIcon" aria-hidden="true">🦆</div>
      </div>
      <div class="centerInfo">
        <div class="turn" id="centerTurn">TURN -</div>
        <div class="centerTable" aria-label="HPとAP">
          <div class="cell left" id="centerHP_P1">1P -/-</div><div class="cell mid">HP</div><div class="cell right" id="centerHP_P2">2P -/-</div>
          <div class="cell left" id="centerAP_P1">1P -</div><div class="cell mid">AP</div><div class="cell right" id="centerAP_P2">2P -</div>
        </div>
        <div class="hpLine" id="centerPhase">PHASE -</div>
      </div>
      <div class="side right">
        <div class="battlerIcon placeholderIcon" id="p2BattlerIcon" aria-hidden="true">2P</div>
        <div class="nameBlock"><div class="nameLine" id="p2Name">-</div></div>
        <div class="duckIcon underName placeholderIcon" id="p2DuckIcon" aria-hidden="true">🦆</div>
      </div>
    </div>
  </header>
  <main class="main"><div class="logArea" id="logArea" aria-live="polite"></div></main>
  <footer class="footer">
    <div><button class="btn" id="btnBack" type="button" hidden>前の画面に戻る</button></div>
    <div class="footerActions">
      <button class="btn primary" id="btnNext" type="button">バトルを進める</button>
      <button class="btn primary" id="btnAll" type="button">全表示</button>
    </div>
  </footer>
  <script type="module" src="js/result.js"></script>
</body>
</html>
