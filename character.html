<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>キャラクター設定 | DiesDuckBattle</title>
  <script src="js/siteTheme.js"></script>
  <script type="module" src="js/siteThemeAuth.js"></script>
  <link rel="stylesheet" href="css/common-theme.css">
  <link rel="stylesheet" href="css/common-page.css">
  <link rel="stylesheet" href="css/character.css">
  <link rel="stylesheet" href="css/common-menu.css">
  <link rel="stylesheet" href="css/online-editor.css">
  <link rel="stylesheet" href="css/page-loading.css">
</head>
<body class="has-common-menu page-loading">
  <script src="js/pageLoadGate.js"></script>
  <noscript>表示設定ページを使用するにはJavaScriptを有効にしてください。</noscript>
<header id="common-menu" class="common-menu"><details class="common-menu__nav"><summary aria-label="ゲームメニューを開く"><span class="common-menu__icon" aria-hidden="true">☰</span></summary><nav aria-label="ゲームメニュー"></nav></details><details class="common-menu__account"><summary aria-label="アカウントメニューを開く" aria-disabled="true" tabindex="-1"><span data-identity role="status"></span><span data-account-arrow aria-hidden="true" hidden>▾</span></summary><div class="common-menu__account-dropdown"><div data-account-menu></div><p data-feedback role="status" hidden></p></div></details></header>
  <script src="js/menuDisplayCache.js"></script>
  <main data-page-content class="character-shell page-shell page-shell--editor">
    <header class="page-header">
      <h1 class="page-title">キャラクター設定</h1>
      <p>立ち絵・アイコン・プロフィール・戦闘セリフ等を登録します。</p>
    </header>

    <p id="load-message" role="status" hidden></p>
    <section id="online-edit-status" class="online-edit-status" aria-label="オンライン保存状態" hidden></section>

    <noscript>表示設定ページを使用するにはJavaScriptを有効にしてください。</noscript>

    <div id="editor" hidden>
      <section aria-labelledby="battler-heading">
        <div class="section-heading"><span>01</span><div><h2 id="battler-heading">バトラー設定</h2><p>立ち絵・アイコン・プロフィール等</p></div></div>
        <div class="card"><label for="battler-name">バトラー名</label><input id="battler-name" type="text" placeholder="バトラー名を入力" required aria-describedby="image-validation-message" autocomplete="off" disabled></div>
        <div id="battler-images" class="image-settings"></div>
        <div id="battler-profile" class="card"></div>
      </section>

      <section aria-labelledby="duck-heading">
        <div class="section-heading"><span>02</span><div><h2 id="duck-heading">アヒル設定</h2><p>保存済みのアヒルごとのアイコン・プロフィール等</p></div></div>
        <div class="card duck-card">
          <h3>対象アヒル・アイコン</h3>
          <label>対象アヒル<select id="duck-select"></select></label>
          <div id="duck-icon-editor"></div>
          <p id="duck-message" class="muted"></p>
        </div>
        <div class="card duck-profile-card">
          <h3>プロフィール</h3>
          <div id="duck-profile-editor"></div>
        </div>
        <div class="card duck-quotes-card">
          <h3>セリフ・カットイン</h3>
          <div id="duck-quotes-editor"></div>
        </div>
      </section>

      <section aria-labelledby="quotes-heading">
        <div class="section-heading"><span>03</span><div><h2 id="quotes-heading">セリフ設定</h2><p>セリフが空の項目は表示されません</p></div></div>
        <div id="quotes"></div>
      </section>

      <footer class="save-bar"><div><strong id="save-message" role="status">変更はありません</strong><p id="image-validation-message" role="status"></p><p id="profile-validation-message" role="status"></p><p class="muted">同じENoの戦闘設定・公開設定も保持してオンライン保存します。</p></div><button id="save" class="primary" type="button">表示設定を保存</button></footer>
    </div>
  </main>

  <dialog data-page-content id="icon-picker" class="icon-picker">
    <div class="picker-header"><div><strong>セリフのアイコン</strong><p>未登録の追加枠は選択できません。</p></div><button id="picker-close" type="button">閉じる</button></div>
    <div id="picker-list" class="picker-list"></div>
  </dialog>
  <script src="js/pageEntry.js" data-page-src="js/characterPage.js"></script>
<script type="module" src="js/commonMenu.js"></script>
</body>
</html>
